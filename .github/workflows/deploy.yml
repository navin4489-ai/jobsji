name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type & content check
        run: npm run check

      - name: Build site
        run: npm run build
        env:
          # Switch back only if the github.io fallback is needed again:
          # SITE_URL: https://navin4489-ai.github.io
          # BASE_PATH: /jobsji
          SITE_URL: https://jobsji.in
          BASE_PATH: /
          # Gemini chat relay (Cloudflare Worker) — see worker/README.md
          PUBLIC_CHAT_API: ${{ vars.PUBLIC_CHAT_API }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
