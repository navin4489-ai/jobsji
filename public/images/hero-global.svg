<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Flight paths from India to Dubai, Tashkent and Europe with verified job cards">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4a75"/>
      <stop offset="1" stop-color="#0F2942"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F2942" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="270" cy="220" r="210" fill="url(#glow)"/>

  <!-- Globe -->
  <circle cx="270" cy="225" r="165" fill="url(#sea)"/>
  <g fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1.5">
    <ellipse cx="270" cy="225" rx="70" ry="165"/>
    <ellipse cx="270" cy="225" rx="130" ry="165"/>
    <path d="M105 225h330M125 145h290M125 305h290"/>
  </g>
  <!-- Abstract land masses -->
  <g fill="#2f6a9e" opacity="0.9">
    <path d="M150 120c30-18 70-14 92 4 14 12 8 30-10 34-22 6-30 22-52 18-26-5-50-38-30-56z"/>
    <path d="M258 150c24-10 52 2 62 20 8 14-4 26-18 24-12-2-16 10-28 8-20-4-34-40-16-52z"/>
    <path d="M318 210c18-6 34 8 34 26 0 26-18 52-30 70-6 9-16 4-17-6-3-30-12-48-6-66 3-12 8-20 19-24z"/>
    <path d="M360 140c26-6 54 6 58 26 4 18-16 22-30 18-14-4-22 6-34 0-14-8-14-38 6-44z"/>
  </g>

  <!-- Flight arcs from India -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">
    <path d="M330 250C300 200 270 200 248 216"/>
    <path d="M330 250C330 180 340 150 372 150"/>
    <path d="M330 250C280 140 220 110 190 132"/>
  </g>

  <!-- Pins -->
  <g>
    <circle cx="330" cy="250" r="11" fill="#F59E0B"/><circle cx="330" cy="250" r="4" fill="#0F2942"/>
    <circle cx="248" cy="216" r="8" fill="#10B981"/><circle cx="248" cy="216" r="3" fill="#fff"/>
    <circle cx="372" cy="150" r="8" fill="#10B981"/><circle cx="372" cy="150" r="3" fill="#fff"/>
    <circle cx="190" cy="132" r="8" fill="#10B981"/><circle cx="190" cy="132" r="3" fill="#fff"/>
  </g>

  <!-- Plane -->
  <g transform="translate(286 190) rotate(-28)">
    <path d="M-16 0h32l8-4-8-4h-10l-10-12h-6l5 12h-11l-4-5h-5l3 9-3 9h5l4-5h11l-5 12h6l10-12h10l8-4-8-4z" fill="#fff" transform="translate(0 4)"/>
  </g>

  <!-- City labels -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">
    <text x="344" y="276">India</text>
    <text x="214" y="240">Dubai</text>
    <text x="382" y="140">Tashkent</text>
    <text x="150" y="122">Europe</text>
  </g>

  <!-- Card: verified job -->
  <g filter="url(#sh)">
    <rect x="12" y="300" width="214" height="86" rx="16" fill="#fff"/>
    <rect x="28" y="316" width="38" height="38" rx="10" fill="#FEF3C7"/>
    <path d="M38 335h18M47 326v18" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="332" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#0F2942">Civil Engineer</text>
    <text x="78" y="350" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#64748B">Dubai · AED 8k–14k / mo</text>
    <rect x="28" y="362" width="120" height="16" rx="8" fill="#ECFDF5"/>
    <text x="38" y="374" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="800" fill="#047857">✓ VISA SPONSORED</text>
  </g>

  <!-- Card: HR contact -->
  <g filter="url(#sh)">
    <rect x="352" y="318" width="160" height="70" rx="16" fill="#fff"/>
    <circle cx="380" cy="353" r="15" fill="#10B981"/>
    <path d="M373 353l5 5 10-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="404" y="348" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#0F2942">Direct HR</text>
    <text x="404" y="365" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">on WhatsApp</text>
  </g>

  <!-- Badge: verified -->
  <g filter="url(#sh)">
    <rect x="388" y="40" width="124" height="40" rx="20" fill="#fff"/>
    <circle cx="410" cy="60" r="11" fill="#ECFDF5"/>
    <path d="M405 60l4 4 7-7" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="428" y="65" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#0F2942">100% Verified</text>
  </g>
</svg>
